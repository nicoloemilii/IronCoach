services:
  app:
    build: .
    env_file: .env
    environment:
      IRON_MODE: hosted
      IRON_DATA_DIR: /data
    volumes:
      - coach-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    stop_grace_period: 45s
  caddy:
    image: caddy:2-alpine
    environment:
      IRON_DOMAIN: ${IRON_DOMAIN:?Set IRON_DOMAIN in .env}
      IRON_ACME_EMAIL: ${IRON_ACME_EMAIL:?Set IRON_ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
volumes:
  coach-data:
  caddy-data:
  caddy-config:
